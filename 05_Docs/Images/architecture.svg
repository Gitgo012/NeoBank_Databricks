<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Data Sources -->
  <rect x="20" y="150" width="180" height="330" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="110" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#0f766e">Data Sources</text>
  <rect x="40" y="215" width="140" height="95" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="110" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">SQL Server /</text>
  <text x="110" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Azure SQL</text>
  <text x="110" y="293" text-anchor="middle" font-size="12" fill="#64748b">customers, accounts…</text>
  <rect x="40" y="335" width="140" height="115" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="110" y="368" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">CSV files in</text>
  <text x="110" y="388" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Databricks Volume</text>
  <text x="110" y="412" text-anchor="middle" font-size="12" fill="#64748b">credit bureau,</text>
  <text x="110" y="429" text-anchor="middle" font-size="12" fill="#64748b">payment gateway logs</text>

  <!-- Ingestion -->
  <rect x="230" y="150" width="190" height="330" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="325" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#0f766e">Data Ingestion</text>
  <rect x="250" y="215" width="150" height="95" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="325" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Spark JDBC</text>
  <text x="325" y="272" text-anchor="middle" font-size="12" fill="#64748b">SQL Server tables</text>
  <text x="325" y="290" text-anchor="middle" font-size="12" fill="#64748b">watermark filtering</text>
  <rect x="250" y="335" width="150" height="115" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="325" y="368" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Auto Loader</text>
  <text x="325" y="388" text-anchor="middle" font-size="12" fill="#64748b">(cloudFiles)</text>
  <text x="325" y="412" text-anchor="middle" font-size="12" fill="#64748b">CSV schema + checkpoint</text>
  <text x="325" y="429" text-anchor="middle" font-size="12" fill="#64748b">stored in the Volume</text>

  <!-- Transformation -->
  <rect x="450" y="150" width="450" height="330" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="675" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#0f766e">Data Transformation</text>
  <text x="675" y="215" text-anchor="middle" font-size="13" fill="#475569">PySpark and SQL notebooks · Delta Lake storage</text>

  <!-- Bronze -->
  <path d="M480,285 a50,15 0 0 1 100,0 v85 a50,15 0 0 1 -100,0 z" fill="#c2763a" stroke="#7c4a1e" stroke-width="1.5"/>
  <ellipse cx="530" cy="285" rx="50" ry="15" fill="#dc9559" stroke="#7c4a1e" stroke-width="1.5"/>
  <text x="530" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Bronze</text>
  <text x="530" y="425" text-anchor="middle" font-size="12" fill="#475569">raw + insert_timestamp</text>
  <!-- Silver -->
  <path d="M635,285 a50,15 0 0 1 100,0 v85 a50,15 0 0 1 -100,0 z" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
  <ellipse cx="685" cy="285" rx="50" ry="15" fill="#d1d5db" stroke="#4b5563" stroke-width="1.5"/>
  <text x="685" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Silver</text>
  <text x="685" y="425" text-anchor="middle" font-size="12" fill="#475569">FULL · APPEND · MERGE</text>
  <!-- Gold -->
  <path d="M790,285 a50,15 0 0 1 100,0 v85 a50,15 0 0 1 -100,0 z" fill="#eab308" stroke="#854d0e" stroke-width="1.5"/>
  <ellipse cx="840" cy="285" rx="50" ry="15" fill="#fde047" stroke="#854d0e" stroke-width="1.5"/>
  <text x="840" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#422006">Gold</text>
  <text x="840" y="425" text-anchor="middle" font-size="12" fill="#475569">5 analytics tables</text>
  <line x1="584" y1="340" x2="630" y2="340" stroke="#0f766e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="739" y1="340" x2="785" y2="340" stroke="#0f766e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Consumption -->
  <rect x="930" y="150" width="250" height="330" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="1055" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#0f766e">Consumption</text>
  <rect x="955" y="215" width="200" height="95" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1055" y="257" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Executive Dashboard</text>
  <text x="1055" y="280" text-anchor="middle" font-size="12" fill="#64748b">business KPIs</text>
  <rect x="955" y="335" width="200" height="115" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1055" y="388" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Databricks Genie</text>
  <text x="1055" y="411" text-anchor="middle" font-size="12" fill="#64748b">natural-language queries</text>

  <!-- Main flow arrows -->
  <line x1="202" y1="315" x2="228" y2="315" stroke="#0f766e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="422" y1="315" x2="448" y2="315" stroke="#0f766e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="902" y1="315" x2="928" y2="315" stroke="#0f766e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Orchestration -->
  <rect x="230" y="20" width="670" height="100" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="565" y="50" text-anchor="middle" font-size="19" font-weight="700" fill="#0f766e">Orchestration and Metadata</text>
  <rect x="260" y="63" width="270" height="44" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="395" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Databricks Jobs / workflows</text>
  <rect x="600" y="63" width="270" height="44" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="735" y="83" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Metadata + audit Delta tables</text>
  <text x="735" y="100" text-anchor="middle" font-size="11" fill="#64748b">banking.metadata schema</text>
  <line x1="675" y1="122" x2="675" y2="148" stroke="#0f766e" stroke-width="3" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Governance -->
  <rect x="230" y="510" width="670" height="100" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="565" y="540" text-anchor="middle" font-size="19" font-weight="700" fill="#0f766e">Governance and Notifications</text>
  <rect x="260" y="553" width="270" height="44" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="395" y="580" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Unity Catalog</text>
  <rect x="600" y="553" width="270" height="44" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="735" y="580" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Email run summary (SMTP)</text>
  <line x1="675" y1="482" x2="675" y2="508" stroke="#0f766e" stroke-width="3" marker-start="url(#arr)" marker-end="url(#arr)"/>
</svg>
